<body class="welcome-page">

    <div class="welcome-stage">

      <div class="welcome-shade" aria-hidden="true"></div>

      <div class="welcome-copy">
        <p class="welcome-kicker"><span data-type>GTA V / iOS PROJECT</span></p>
        <h1 data-shine>
          <span class="welcome-line">Welcome to</span>
          <span class="welcome-line welcome-accent">GTA V iOS.</span>

              <span class="visit-pulse" aria-hidden="true"></span>

              <strong id="visit-count" aria-live="polite">···</strong>

      </div>
