<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10100f">
<title>GTA V iOS Community</title>
<script>
(()=>{
 const current=new URL(location.href);
 const target=new URL('/home',location.origin);
 target.searchParams.set('intro','1');
 const ret=current.searchParams.get('return');
 if(ret)target.searchParams.set('return',ret);
 location.replace(target.pathname+target.search+target.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/home?intro=1"></noscript>
</head>
