<body data-page="franklin-direct">
  <main class="franklin-direct-shell" aria-label="Franklin Helper direct access">
    <a class="franklin-direct-brand" href="/home" aria-label="GTA V iOS Community home">
      <img src="/assets/gtav-logo.jpeg" alt="" width="34" height="34">
      <span>GTA V <b>iOS</b></span>

    <section class="franklin-direct-gate" aria-labelledby="franklin-direct-title">
